kind: Namespace
apiVersion: v1
metadata:
  name: external-model
  labels:
    maas.opendatahub.io/gateway-access: 'true'
spec:
  finalizers:
    - kubernetes
---
kind: Secret
apiVersion: v1
metadata:
  name: openai-api-key
  namespace: external-model
  labels:
    inference.llm-d.ai/ipp-managed: 'true'
stringData:
  api-key: MYKEY
type: Opaque
---
apiVersion: inference.opendatahub.io/v1alpha1
kind: ExternalProvider
metadata:
  name: openai
  namespace: external-model
spec:
  provider: openai
  endpoint: maas-rhdp.apps.maas.redhatworkshops.io
  auth:
    type: apikey
    secretRef:
      name: openai-api-key
---
apiVersion: inference.opendatahub.io/v1alpha1
kind: ExternalModel
metadata:
  name: gpt-oss-120b
  namespace: external-model
spec:
  modelName: gpt-oss-120b
  externalProviderRefs:
    - ref:
        name: openai
      targetModel: gpt-oss-120b
      apiFormat: openai-chat
      path: /v1/chat/completions
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSModelRef
metadata:
  name: gpt-oss-120b
  namespace: external-model
  annotations:
    openshift.io/display-name: "GPT OSS 120B"
    openshift.io/description: "GPT OSS 120B Mini via OpenAI-compatible API"
spec:
  modelRef:
    kind: ExternalModel
    name: gpt-oss-120b
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: openai-access
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "External Model Access"
    openshift.io/description: "Grants all authenticated users access to the external model"
spec:
  modelRefs:
    - name: gpt-oss-120b
      namespace: external-model
  subjects:
    groups:
      - name: system:authenticated
    users: []
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  name: openai-free
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "Free Tier"
    openshift.io/description: "Free tier: 10000 tokens/hour for all authenticated users"
spec:
  owner:
    groups:
      - name: system:authenticated
    users: []
  modelRefs:
    - name: gpt-oss-120b
      namespace: external-model
      tokenRateLimits:
        - limit: 10000
          window: 1h
  priority: 10