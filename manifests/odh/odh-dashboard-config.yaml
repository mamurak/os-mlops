apiVersion: opendatahub.io/v1alpha
kind: OdhDashboardConfig
metadata:
  annotations:
    platform.opendatahub.io/instance.generation: '1'
    platform.opendatahub.io/instance.name: default-dashboard
    platform.opendatahub.io/type: OpenShift AI Self-Managed
    platform.opendatahub.io/version: 2.23.0
  name: odh-dashboard-config
  namespace: redhat-ods-applications
  labels:
    app: rhods-dashboard
    app.kubernetes.io/part-of: rhods-dashboard
    app.opendatahub.io/rhods-dashboard: 'true'
    platform.opendatahub.io/part-of: dashboard
spec:
  dashboardConfig:
    disableLMEval: false
    disableTracking: false
    disableKServeMetrics: false
    disableModelRegistry: false
    disableModelCatalog: false
    genAiStudio: true
    modelAsService: true
    enablement: true
    disableTrustyBiasMetrics: false
    disableProjectScoped: false
    disableDistributedWorkloads: true
    disableProjects: false
    disableKueue: true
    aiAssetCustomEndpoints: true
    disableSupport: false
    disableHome: false
    autorag: true
    disablePipelines: false
    disableProjectSharing: false
    disableModelServing: false
    disableKServe: false
    disableNIMModelServing: false
    disableCustomServingRuntimes: false
    automl: true
    trainingJobs: true
    disableModelRegistrySecureDB: false
    disableStorageClasses: false
    observabilityDashboard: true
    disableKServeAuth: false
    disableISVBadges: false
    disableAdminConnectionTypes: false
    disableUserManagement: false
    disableInfo: false
    disableServingRuntimeParams: false
    disableClusterManager: false
    disablePerformanceMetrics: false
    disableKServeRaw: false
    disableBYONImageStream: false
    mcpCatalog: true
    vLLMDeploymentOnMaaS: true
    externalModels: true
    connectionTest: true
    agentsCatalog: true
    agentOps: true
    mcpRegistry: true
    guardrails: true
    agentConfigManagement: true
    genAiTracing: true
    promptManagement: true
    globalProjectPrompts: true
    llmdTemplates: true
    toolCalling: true
  modelServerSizes:
    - name: Small
      resources:
        limits:
          cpu: '2'
          memory: 8Gi
        requests:
          cpu: '1'
          memory: 4Gi
    - name: Medium
      resources:
        limits:
          cpu: '8'
          memory: 10Gi
        requests:
          cpu: '4'
          memory: 8Gi
    - name: Large
      resources:
        limits:
          cpu: '10'
          memory: 20Gi
        requests:
          cpu: '6'
          memory: 16Gi
  notebookController:
    enabled: true
    notebookNamespace: rhods-notebooks
    pvcSize: 5Gi
  notebookSizes:
    - name: Small
      resources:
        limits:
          cpu: '2'
          memory: 8Gi
        requests:
          cpu: '1'
          memory: 8Gi
    - name: Medium
      resources:
        limits:
          cpu: '6'
          memory: 24Gi
        requests:
          cpu: '3'
          memory: 24Gi
    - name: Large
      resources:
        limits:
          cpu: '14'
          memory: 56Gi
        requests:
          cpu: '7'
          memory: 56Gi
    - name: X Large
      resources:
        limits:
          cpu: '30'
          memory: 120Gi
        requests:
          cpu: '15'
          memory: 120Gi
  templateDisablement: []
  templateOrder: []
